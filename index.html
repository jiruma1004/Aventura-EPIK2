</style></head><body><main class="gate" aria-busy="true"><small>AVENTURA EPIK II · 0.12.16</small><h1 id="gate-title">Una señal desde la Luna</h1><p id="gate-intro">Historia, exploración y retos de física.<br>Tu aventura continúa desde este navegador.</p><label for="gate-language">Idioma / Language</label><select id="gate-language"><option value="es">Español</option><option value="en">English</option></select><form id="gate-form"><button id="unlock">Comenzar aventura →</button><p id="status" role="status" aria-live="polite">Listo para comenzar.</p></form></main><script>'use strict';
const payload={"version":"0.12.16","format":"gzip-json","core":"game-93dde398f5d8.bin","bytes":463903,"sha256":"93dde398f5d8b834f1d3291a29f55f5a3196068e598c2ee3bfedccc378af8203"};
const siteRoot=new URL('./',location.href);
const languageKey='epik2:language:v1';
let language='es';
try{language=new URLSearchParams(location.search).get('lang')||localStorage.getItem(languageKey)||'es';}catch{}
if(!['es','en'].includes(language))language='es';
const words={es:{adventure:'Mi aventura',expand:'⛶ Extender pantalla',reduce:'↙ Reducir pantalla',unavailable:'Pantalla completa no disponible · F11',opening:'Abriendo la aventura…',context:'Abre esta página mediante HTTPS o localhost.',download:'No se completó la descarga. Revisa tu conexión y vuelve a intentar.',title:'Una señal desde la Luna',intro:'Historia, exploración y retos de física. Tu aventura continúa desde este navegador.',start:'Comenzar aventura →',ready:'Listo para comenzar.',languageHint:'Idioma: regresa al menú conservando las etapas completadas.'},en:{adventure:'My adventure',expand:'⛶ Fullscreen',reduce:'↙ Exit fullscreen',unavailable:'Fullscreen unavailable · F11',opening:'Opening the adventure…',context:'Open this page using HTTPS or localhost.',download:'Download incomplete. Check your connection and try again.',title:'A signal from the Moon',intro:'Story, exploration and physics challenges. Your adventure continues in this browser.',start:'Start adventure →',ready:'Ready to begin.',languageHint:'Language: returns to the menu, keeping completed stages.'}};
const word=key=>words[language][key];
function selectLanguage(value){language=value==='en'?'en':'es';document.documentElement.lang=language;try{localStorage.setItem(languageKey,language);}catch{}}
function languageSelect(id){return '<select id="'+id+'" aria-label="Idioma / Language"><option value="es">Español</option><option value="en">English</option></select>';}
function updateGate(){document.documentElement.lang=language;document.getElementById('gate-title').textContent=word('title');document.getElementById('gate-intro').textContent=word('intro');document.getElementById('unlock').textContent=word('start');document.getElementById('status').textContent=word('ready');document.getElementById('gate-language').value=language;}

// Navigation allowlist is a product boundary, not proof of honest gameplay.
function studentRoute(route){
  let url;try{url=new URL(route,siteRoot);}catch{return null;}
  if(url.origin!==siteRoot.origin||!url.pathname.startsWith(siteRoot.pathname))return null;
  let name;try{name=decodeURIComponent(url.pathname.slice(siteRoot.pathname.length));}catch{return null;}
  if(!['campana.html','mudsumaki.html'].includes(name))return null;
  const search=new URLSearchParams();
  if(name==='mudsumaki.html')search.set('campaign','short');
  for(const key of ['slot','menu','continue','sound']){const value=url.searchParams.get(key);if(value!==null&&/^[0-3]$/.test(value))search.set(key,value);}
  return {name,search:search.size?'?'+search.toString():'',hash:''};
}
function mountStudent(archive){
  const media=Object.fromEntries(Object.entries(archive.media).map(([name,item])=>[name,new URL(item.path,siteRoot).href]));
  document.body.innerHTML='<nav class="release-nav" aria-label="Aventura"><strong>EPIK II · '+archive.version+'</strong><button id="adventure">'+word('adventure')+'</button>'+languageSelect('game-language')+'<button id="expand-screen" aria-pressed="false">'+word('expand')+'</button></nav><iframe allow="autoplay; fullscreen" allowfullscreen id="release-frame" title="Aventura EPIK II"></iframe>';
  document.body.classList.add('unlocked');
  const frame=document.getElementById('release-frame');let currentScript=null;
  function render(route,push=true){
    const target=studentRoute(route);if(!target)return;
    const original=(language==='en'?archive.languages?.en:archive.pages)?.[target.name];if(!original)return;
    const page=original.replace(/assets\/[a-zA-Z0-9_./-]+\.(?:png|webp|jpg|mp3|woff|svg|gif)/g,path=>media[path]||path);
    const scripts=[];const markup=page.replace(/<script[^>]*>([\s\S]*?)<\/script>/g,(_,source)=>{scripts.push(source);return '';});
    const bridge=`window.__epikRoute=${JSON.stringify({search:target.search,hash:''})};document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a||a.hasAttribute('download'))return;const href=a.getAttribute('href');if(href.startsWith('#'))return;let u;try{u=new URL(href,${JSON.stringify(siteRoot.href)});}catch{e.preventDefault();return;}e.preventDefault();if(u.origin===${JSON.stringify(siteRoot.origin)})parent.postMessage({epikStudentRoute:u.href},${JSON.stringify(siteRoot.origin)});});`;
    const nextScript=URL.createObjectURL(new Blob([bridge+'\n'+scripts.join('\n')],{type:'text/javascript'}));
    try{frame.contentWindow.dispatchEvent(new frame.contentWindow.Event('pagehide'));}catch{}
    frame.srcdoc=markup.replace('</body>','<script type="module" src="'+nextScript+'"><\/script></body>');
    const previous=currentScript;currentScript=nextScript;if(previous)URL.revokeObjectURL(previous);
    if(push){const outer=new URL(location.href);outer.search='';outer.hash='';outer.searchParams.set('v',archive.version);outer.searchParams.set('lang',language);outer.searchParams.set('view',target.name+target.search);history.pushState({},'',outer);}
  }
  const initial=()=>studentRoute(new URLSearchParams(location.search).get('view')||'campana.html')||studentRoute('campana.html');
  const openInitial=()=>{const target=initial();render(target.name+target.search,false);};
  window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.origin===location.origin&&typeof e.data?.epikStudentRoute==='string')render(e.data.epikStudentRoute);});
  const picker=document.getElementById('game-language');picker.value=language;picker.title=word('languageHint');
  picker.onchange=()=>{selectLanguage(picker.value);document.getElementById('adventure').textContent=word('adventure');picker.title=word('languageHint');update();render('campana.html?menu=1');};
  document.getElementById('adventure').onclick=()=>render('campana.html?menu=1');
  const expand=document.getElementById('expand-screen');
  const update=()=>{expand.textContent=document.fullscreenElement?word('reduce'):word('expand');expand.setAttribute('aria-pressed',String(Boolean(document.fullscreenElement)));};
  expand.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{expand.textContent=word('unavailable');}};
  document.addEventListener('fullscreenchange',update);window.addEventListener('popstate',openInitial);openInitial();
}
async function openAdventure(){
  const button=document.getElementById('unlock'),status=document.getElementById('status');
  button.disabled=true;status.textContent=word('opening');
  try{
    const response=await fetch(new URL(payload.core,siteRoot),{cache:'force-cache'});if(!response.ok)throw new Error('download');
    const packed=await response.arrayBuffer();if(packed.byteLength!==payload.bytes)throw new Error('download');
    const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',packed)),v=>v.toString(16).padStart(2,'0')).join('');if(digest!==payload.sha256)throw new Error('download');
    const archive=JSON.parse(await new Response(new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'))).text());mountStudent(archive);
  }catch(error){status.textContent=word('download');button.disabled=false;}
}
document.getElementById('gate-form').addEventListener('submit',event=>{event.preventDefault();openAdventure();});
document.getElementById('gate-language').onchange=event=>{selectLanguage(event.target.value);updateGate();};updateGate();openAdventure();
</script></body></html>
