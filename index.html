<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="same-origin"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' blob: 'sha256-foYOyyUUAXCe1Jp8NMkJRVbIkhDkwEmhzRhHg/C+9Ww='; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Aventura EPIK II · 0.12.10</title><style>
:root{color-scheme:dark;font-family:system-ui;color:#eee4cc;background:#0b1521}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at 60% 20%,#24504b55,transparent 60%),#0b1521}.gate{width:min(510px,92vw);padding:32px;border:1px solid #dabb7766;border-radius:16px;background:#142331}h1{font:38px Georgia;color:#edcb89}p{line-height:1.6;color:#b9cad2}label{display:block;margin:24px 0 8px}input,button{font:inherit;border-radius:6px;padding:12px;border:1px solid #80999d;background:#102332;color:#f5e5c3}input{width:100%}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #efcf8d;outline-offset:3px}.gate button{width:100%;margin-top:14px;background:#e5c68e;color:#142331;font-weight:bold}button:disabled{opacity:.5}small{color:#c6b58d}#status{min-height:2em;font-size:14px}.unlocked{display:block;height:100dvh;overflow:hidden}.release-nav{height:58px;display:flex;align-items:center;gap:10px;padding:8px 15px;overflow-x:auto;white-space:nowrap;border-bottom:1px solid #dabb7744}.release-nav strong{font-size:12px;color:#edcb89;margin-right:auto}.release-nav button{font-size:12px;padding:9px;min-height:40px}#release-frame{display:block;border:0;width:100%;height:calc(100dvh - 58px);background:#0b1521}@media(max-width:650px){.release-nav strong{display:none}.release-nav{gap:6px;padding:6px}}
</style></head><body><main class="gate"><small>AVENTURA EPIK II · 0.12.10</small><h1>Una señal desde la Luna</h1><p>Historia, exploración y retos de física.<br>Tu aventura continúa desde este navegador.</p><form id="gate-form"><label for="password">Contraseña de acceso</label><input id="password" type="password" autocomplete="current-password" required><button id="unlock">Comenzar aventura →</button><p id="status" role="status" aria-live="polite">Listo para comenzar.</p></form></main><script>'use strict';
const payload={"version":"0.12.10","salt":"MiCQeD/gM86pWsdBuA3MnQ==","iv":"OMM0viOxDu5WO5EZ","iterations":600000,"core":"game-cc6a399e5210.bin","bytes":178767,"sha256":"cc6a399e5210c021ef2276898415c85e0c417e4dc90525a85ba5301f15673245"};
const decode=s=>{const binary=atob(s),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return bytes;};
const siteRoot=new URL('./',location.href);
// Navigation allowlist is a product boundary, not proof of honest gameplay.
function studentRoute(route){
  let url;try{url=new URL(route,siteRoot);}catch{return null;}
  if(url.origin!==siteRoot.origin||!url.pathname.startsWith(siteRoot.pathname))return null;
  let name;try{name=decodeURIComponent(url.pathname.slice(siteRoot.pathname.length));}catch{return null;}
  if(!['campana.html','mudsumaki.html'].includes(name))return null;
  const search=new URLSearchParams();
  if(name==='mudsumaki.html')search.set('campaign','short');
  for(const key of ['slot','menu','continue','sound']){const value=url.searchParams.get(key);if(value!==null&&/^[0-3]$/.test(value))search.set(key,value);}
  return {name,search:search.size?'?'+search.toString():'',hash:''};
}
function mountStudent(archive){
  const media=Object.fromEntries(Object.entries(archive.media).map(([name,item])=>[name,new URL(item.path,siteRoot).href]));
  document.body.innerHTML='<nav class="release-nav" aria-label="Aventura"><strong>EPIK II · '+archive.version+'</strong><button id="adventure">Mi aventura</button><button id="expand-screen" aria-pressed="false">⛶ Extender pantalla</button><button id="lock">Cerrar acceso</button></nav><iframe allow="autoplay; fullscreen" allowfullscreen id="release-frame" title="Aventura EPIK II"></iframe>';
  document.body.classList.add('unlocked');
  const frame=document.getElementById('release-frame');let currentScript=null;
  function render(route,push=true){
    const target=studentRoute(route);if(!target)return;
    const original=archive.pages[target.name];if(!original)return;
    const page=original.replace(/assets\/[a-zA-Z0-9_./-]+\.(?:png|webp|jpg|mp3|woff|svg)/g,path=>media[path]||path);
    const scripts=[];const markup=page.replace(/<script[^>]*>([\s\S]*?)<\/script>/g,(_,source)=>{scripts.push(source);return '';});
    const bridge=`window.__epikRoute=${JSON.stringify({search:target.search,hash:''})};document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a||a.hasAttribute('download'))return;const href=a.getAttribute('href');if(href.startsWith('#'))return;let u;try{u=new URL(href,${JSON.stringify(siteRoot.href)});}catch{e.preventDefault();return;}e.preventDefault();if(u.origin===${JSON.stringify(siteRoot.origin)})parent.postMessage({epikStudentRoute:u.href},${JSON.stringify(siteRoot.origin)});});`;
    const nextScript=URL.createObjectURL(new Blob([bridge+'\n'+scripts.join('\n')],{type:'text/javascript'}));
    frame.srcdoc=markup.replace('</body>','<script type="module" src="'+nextScript+'"><\/script></body>');
    const previous=currentScript;currentScript=nextScript;if(previous)URL.revokeObjectURL(previous);
    if(push){const outer=new URL(location.href);outer.search='';outer.hash='';outer.searchParams.set('v',archive.version);outer.searchParams.set('view',target.name+target.search);history.pushState({},'',outer);}
  }
  const initial=()=>studentRoute(new URLSearchParams(location.search).get('view')||'campana.html')||studentRoute('campana.html');
  const openInitial=()=>{const target=initial();render(target.name+target.search,false);};
  window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.origin===location.origin&&typeof e.data?.epikStudentRoute==='string')render(e.data.epikStudentRoute);});
  document.getElementById('adventure').onclick=()=>render('campana.html?menu=1');
  document.getElementById('lock').onclick=()=>location.reload();
  const expand=document.getElementById('expand-screen');
  const update=()=>{expand.textContent=document.fullscreenElement?'↙ Reducir pantalla':'⛶ Extender pantalla';expand.setAttribute('aria-pressed',String(Boolean(document.fullscreenElement)));};
  expand.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{expand.textContent='Pantalla completa no disponible · F11';}};
  document.addEventListener('fullscreenchange',update);window.addEventListener('popstate',openInitial);openInitial();
}
document.getElementById('gate-form').addEventListener('submit',async event=>{
  event.preventDefault();const button=document.getElementById('unlock'),status=document.getElementById('status'),field=document.getElementById('password');
  button.disabled=true;status.textContent='Abriendo la aventura…';
  try{
    if(!crypto.subtle)throw new Error('context');
    const response=await fetch(new URL(payload.core,siteRoot),{cache:'force-cache'});if(!response.ok)throw new Error('download');
    const encrypted=await response.arrayBuffer();if(encrypted.byteLength!==payload.bytes)throw new Error('download');
    const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',encrypted)),v=>v.toString(16).padStart(2,'0')).join('');if(digest!==payload.sha256)throw new Error('download');
    const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(field.value),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
    const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(payload.iv),additionalData:new TextEncoder().encode('EPIK-II-STUDENT-v1')},key,encrypted);
    const archive=JSON.parse(await new Response(new Blob([clear]).stream().pipeThrough(new DecompressionStream('gzip'))).text());field.value='';mountStudent(archive);
  }catch(error){
    status.textContent=error.message==='context'?'Abre esta página mediante HTTPS o localhost.':error.message==='download'?'No se completó la descarga. Revisa tu conexión y vuelve a intentar.':'No se pudo abrir. Revisa la contraseña y vuelve a intentar.';
    button.disabled=false;field.select();
  }
});
