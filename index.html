<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b141e"><title>Aventura EPIK II · Acceso de desarrollo</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#eee9dd;background:#0b141e}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at 60% 20%,#24504b55,transparent 60%),#0b141e}.gate{width:min(440px,90vw);padding:42px;border:1px solid #dabb773d;border-radius:16px;background:#142331bb;box-shadow:0 30px 100px #0006}.symbol{font:50px Georgia;color:#eac481}.eyebrow{letter-spacing:3px;font-size:10px;color:#b8c8c7}h1{font:36px Georgia;margin:16px 0}p{font-size:14px;line-height:1.7;color:#aabdc4}label{display:block;font-size:12px;margin:28px 0 8px}input{width:100%;padding:13px;background:#091522;border:1px solid #7d949866;border-radius:6px;color:white;font:16px system-ui}button{width:100%;padding:13px;margin-top:16px;background:#eac481;color:#15232d;border:0;border-radius:6px;font:600 14px system-ui;cursor:pointer}button:disabled{opacity:.6}input:focus-visible,button:focus-visible{outline:3px solid #83ddbb;outline-offset:3px}#status{min-height:24px;font-size:12px}.foot{font-size:10px;letter-spacing:1px;border-top:1px solid #ffffff16;padding-top:20px;margin-top:12px}</style></head><body><main class="gate"><div class="symbol" aria-hidden="true">✦</div><span class="eyebrow">CRÓNICAS DE EPITHEA</span><h1>Aventura EPIK II</h1><p>La celebración terminó.<br>La aventura apenas comienza.</p><form id="gate-form"><label for="password">Contraseña del modo desarrollador</label><input id="password" type="password" autocomplete="current-password" required><button id="unlock">Entrar al prototipo →</button><p id="status" role="status" aria-live="polite"></p></form><div class="foot">VERSIÓN 0.6 · ACCESO DE REVISIÓN</div></main><script src="payload-1.js"></script><script src="payload-2.js"></script><script>
const payload={"salt": "sb6x2ZIOzVCdF8PNZ9rQJQ==", "iv": "nmr5ja5x4BP1QEpT", "iterations": 600000, "compression": "gzip"};
const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById('gate-form').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('unlock'),status=document.getElementById('status'),field=document.getElementById('password');button.disabled=true;status.textContent='Abriendo Epithea…';try{if(!crypto.subtle)throw new Error('context');const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(field.value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(payload.iv),additionalData:new TextEncoder().encode('EPIK-II-DEVELOPER-v1')},key,decode(epikCipherParts.join('')));const html=payload.compression==='gzip'?await new Response(new Blob([clear]).stream().pipeThrough(new DecompressionStream('gzip'))).text():new TextDecoder().decode(clear);field.value='';document.open();document.write(html);document.close();}catch(error){status.textContent=error.message==='context'?'Abre esta vista mediante HTTPS o en localhost.':'No se pudo abrir. Revisa la contraseña y vuelve a intentarlo.';button.disabled=false;field.select();}});
</script></body></html>
