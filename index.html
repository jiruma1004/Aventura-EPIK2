:root{color-scheme:dark;font-family:system-ui;color:#eee4cc;background:#0b1521}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at 60% 20%,#24504b55,transparent 60%),#0b1521}.gate{width:min(510px,92vw);padding:36px;border:1px solid #dabb7766;border-radius:16px;background:#142331}h1{font:38px Georgia;color:#edcb89}p{line-height:1.6;color:#b9cad2}label{display:block;margin:24px 0 8px}input,button{font:inherit;border-radius:6px;padding:12px;border:1px solid #80999d;background:#102332;color:#f5e5c3}input{width:100%}button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #efcf8d;outline-offset:3px}.gate button{width:100%;margin-top:14px;background:#e5c68e;color:#142331;font-weight:bold}button:disabled{opacity:.5}small{color:#c6b58d}#status{min-height:2em;font-size:13px}.unlocked{display:block;height:100dvh;overflow:hidden;background:#0b1521}.release-nav{height:58px;display:flex;align-items:center;gap:10px;padding:8px 15px;overflow-x:auto;white-space:nowrap;border-bottom:1px solid #dabb7744}.release-nav strong{font-size:12px;color:#edcb89;margin-right:auto}.release-nav button{font-size:12px;padding:9px;min-height:40px}#release-frame{display:block;border:0;width:100%;height:calc(100dvh - 58px);background:#0b1521}@media(max-width:650px){.release-nav strong{display:none}.release-nav{gap:6px;padding:6px}}

</style></head><body><main class="gate"><small>EDICIÓN UNIFICADA · 0.12.9</small><h1>Aventura EPIK II</h1><p>Una aventura de cómic rumbo a la Luna.<br>Historia, exploración y retos en un mismo recorrido.</p><form id="gate-form"><label for="password">Contraseña del desarrollador</label><input id="password" type="password" autocomplete="current-password" required disabled><button id="unlock" disabled>Comenzar aventura →</button><p id="status" role="status" aria-live="polite">Preparando la descarga…</p></form></main><script src="epik-aa5cdd08c8bd-1.js"></script><script src="epik-aa5cdd08c8bd-2.js"></script><script src="epik-aa5cdd08c8bd-3.js"></script><script src="epik-aa5cdd08c8bd-4.js"></script><script src="epik-aa5cdd08c8bd-5.js"></script><script src="epik-aa5cdd08c8bd-6.js"></script><script src="epik-aa5cdd08c8bd-7.js"></script><script src="epik-aa5cdd08c8bd-8.js"></script><script src="epik-aa5cdd08c8bd-9.js"></script><script src="epik-aa5cdd08c8bd-10.js"></script><script src="epik-aa5cdd08c8bd-11.js"></script><script src="epik-aa5cdd08c8bd-12.js"></script><script src="epik-aa5cdd08c8bd-13.js"></script><script>
const payload={"salt": "rUbvspONGbiNMHVBHVGjaQ==", "iv": "OHUvgjDedkzk6D6+", "iterations": 600000, "version": "0.12.9"};
// Fill the binary buffer directly: iterable conversion builds a huge temporary
// JavaScript array and can exhaust the browser heap on a complete game release.
const decode=s=>{const binary=atob(s),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return bytes;};
// This shell owns navigation; each page gets an isolated same-origin document.
function mountRelease(archive){
  const urls={};for(const [name,asset] of Object.entries(archive.assets)){urls[name]=URL.createObjectURL(new Blob([decode(asset.base64)],{type:asset.mime}));}
  const siteRoot=new URL('./',location.href),textEscape=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
  document.body.innerHTML='<nav class="release-nav" aria-label="Aventura y actividades opcionales"><strong>EPIK II · '+archive.version+'</strong><button class="release-adventure" data-route="campana.html?menu=1">Mi aventura</button><button class="release-secondary" id="expand-screen" aria-pressed="false">⛶ Extender pantalla</button><button class="release-secondary" data-route="catalogo.html">Actividades opcionales</button><button class="release-secondary" data-route="index.html?mode=lunar&edit=1" aria-label="Herramientas: editor lunar">Editor lunar</button><button class="release-secondary" id="lock">Cerrar acceso</button></nav><iframe allow="autoplay; fullscreen" allowfullscreen id="release-frame" title="Aventura EPIK II · campaña y actividades"></iframe>';
  const expand=document.getElementById('expand-screen');
  const updateFullscreen=()=>{expand.textContent=document.fullscreenElement?'↙ Reducir pantalla':'⛶ Extender pantalla';expand.setAttribute('aria-pressed',String(Boolean(document.fullscreenElement)));};
  expand.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();updateFullscreen();}catch{expand.textContent='Pantalla completa no disponible · usa F11';}};
  document.addEventListener('fullscreenchange',updateFullscreen);
  const frame=document.getElementById('release-frame');document.body.classList.add('unlocked');
  function render(route,push=true){
    let url=new URL(route,siteRoot);if(url.origin!==siteRoot.origin||!url.pathname.startsWith(siteRoot.pathname))return;
    let name=decodeURIComponent(url.pathname.slice(siteRoot.pathname.length))||'index.html';
    if(name==='outputs/developer-preview.html')name='index.html';
    const actualRoute=name+url.search+url.hash;
    if(push){const outer=new URL(location.href);outer.search='';outer.hash='';outer.searchParams.set('view',actualRoute);history.pushState({},'',outer);}
    let page=archive.pages[name];
    if(name==='catalogo.html'&&page)page=page.replace(/Local 0\.11\.0: recorrido breve con cierre de Kadsumi, sin tests ni Iván\. Publicación vigente: 0\.10\.1, anterior a este recorte\./g,'Edición '+archive.version+': campaña breve, batalla final, biblioteca y editor.').replaceAll('Abrir versión pública 0.10.1','Abrir versión pública '+archive.version);
    if(!page){
      const text=archive.texts[name];
      const content=text!==undefined?'<pre>'+textEscape(text)+'</pre>':urls[name]?'<img alt="Recurso del proyecto" src="'+urls[name]+'">':'<h1>Archivo conservado en el proyecto local</h1><p>Los videos históricos y archivos de trabajo no forman parte de esta entrega web. Las escenas, actividades y herramientas actuales están en la biblioteca.</p>';
      page='<!doctype html><html lang="es"><head><meta charset="utf-8"><style>body{background:#101c29;color:#eadfc7;margin:30px;font:16px/1.6 system-ui}a{color:#aadcd5}pre{white-space:pre-wrap;overflow-wrap:anywhere}img{max-width:100%}</style></head><body><a href="'+siteRoot+'catalogo.html">← Biblioteca</a>'+content+'</body></html>';
    }
    // All binary resources are decrypted locally once and shared as object URLs.
    const replaceAssets=s=>s.replace(/assets\/[a-zA-Z0-9_./-]+\.(?:png|webp|jpg|mp3|woff|svg)/g,path=>urls[path]||path);
    page=name==='catalogo.html'?page.replace(/<style>[\s\S]*?<\/style>/g,replaceAssets):replaceAssets(page);
    const bridge=`<base href="${new URL(name,siteRoot).href}"><script>window.__epikRoute=${JSON.stringify({search:url.search,hash:url.hash})};document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a||a.hasAttribute('download'))return;const u=new URL(a.getAttribute('href'),${JSON.stringify(new URL(name,siteRoot).href)});if(u.origin===${JSON.stringify(siteRoot.origin)}&&u.pathname.startsWith(${JSON.stringify(siteRoot.pathname)})){e.preventDefault();parent.postMessage({epikRoute:u.href},${JSON.stringify(siteRoot.origin)});}});<\/script>`;
    page=page.replace(/<head[^>]*>/i,m=>m+bridge);frame.srcdoc=page;
  }
  function initial(){const params=new URLSearchParams(location.search);return params.get('view')||(params.has('mode')||params.has('scene')||params.has('opening')?'index.html'+location.search:'campana.html');}
  window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.origin===location.origin&&typeof e.data?.epikRoute==='string')render(e.data.epikRoute);});
  document.querySelector('.release-nav').onclick=e=>{const route=e.target.closest('[data-route]')?.dataset.route;if(route)render(route);};
  document.getElementById('lock').onclick=()=>location.reload();window.addEventListener('popstate',()=>render(initial(),false));
  render(initial(),false);
}

const downloadReady=typeof epikCipherParts!=='undefined'&&epikCipherParts.length===document.querySelectorAll('script[src^="epik-"]').length;
document.getElementById('status').textContent=downloadReady?'Versión completa lista para abrir.':'No se completó la descarga. Recarga la página.';
document.getElementById('unlock').disabled=!downloadReady;
document.getElementById('password').disabled=!downloadReady;
document.getElementById('gate-form').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('unlock'),status=document.getElementById('status'),field=document.getElementById('password');button.disabled=true;status.textContent='Abriendo la aventura…';try{if(!crypto.subtle)throw new Error('context');const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(field.value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(payload.iv),additionalData:new TextEncoder().encode('EPIK-II-UNIFIED-v1')},key,decode(epikCipherParts.join('')));const archive=JSON.parse(await new Response(new Blob([clear]).stream().pipeThrough(new DecompressionStream('gzip'))).text());field.value='';epikCipherParts=[];mountRelease(archive);}catch(error){status.textContent=error.message==='context'?'Abre esta vista mediante HTTPS o localhost.':'No se pudo abrir. Revisa la contraseña y la descarga.';button.disabled=false;field.select();}});
</script></body></html>
